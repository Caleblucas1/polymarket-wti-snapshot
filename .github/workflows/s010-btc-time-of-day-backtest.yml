name: S-010 BTC time-of-day backtest

on:
  pull_request:
    paths:
      - "signal_research/backtest_s010_btc_time_of_day.py"
      - "docs/SIGNAL_S010_S011_RESEARCH_PLAN.md"
      - ".github/workflows/s010-btc-time-of-day-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backtest
        run: python -m py_compile signal_research/backtest_s010_btc_time_of_day.py
      - name: Run historical backtest
        run: |
          python signal_research/backtest_s010_btc_time_of_day.py \
            --start 2024-01-01 \
            --end 2026-06-30 \
            --cost-bps 14 \
            --output artifacts/S010_BTC_TIME_OF_DAY.json
      - name: Upload auditable result
        uses: actions/upload-artifact@v4
        with:
          name: s010-btc-time-of-day-${{ github.run_id }}
          path: artifacts/S010_BTC_TIME_OF_DAY.json
          retention-days: 90
