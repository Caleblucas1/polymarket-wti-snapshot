name: Live reliability guardrails

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * *"

jobs:
  reliability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Validate signal registry and linked records
        run: python signal_cli.py validate
      - name: Run focused reliability regressions
        run: python -m unittest tests.test_signal_reliability -v
      - name: Run full repository test suite
        run: python -m unittest discover -s tests -v
