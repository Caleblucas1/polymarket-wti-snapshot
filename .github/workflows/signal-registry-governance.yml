name: Signal registry governance

on:
  pull_request:
    paths:
      - "signal_candidates.json"
      - "signal_hypotheses.json"
      - "signal_cli.py"
      - "signal_research/**"
      - "signal_records/**"
      - "docs/SIGNAL_*.md"
      - "tests/test_signal_*.py"
  push:
    paths:
      - "signal_candidates.json"
      - "signal_hypotheses.json"
      - "signal_cli.py"
      - "signal_research/**"
      - "signal_records/**"
      - "docs/SIGNAL_*.md"
      - "tests/test_signal_*.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate registry and canonical hypotheses
        run: python signal_cli.py validate
      - name: Validate research priority decision
        run: python -m signal_research.priorities --validate
      - name: Run signal governance tests
        run: python -m unittest discover -s tests -p "test_signal_*.py" -v
